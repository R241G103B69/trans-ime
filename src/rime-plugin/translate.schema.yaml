# Rime schema: translate
# encoding: utf-8

schema:
  schema_id: translate
  name: "译打 · 翻译输入法"
  version: "1.0.0"
  author:
    - "TransType Team"
  description: |
    输入中文拼音，自动翻译并提供英文候选词；
    选词上屏后，直接输出英文！

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - lua_translator@trans_translator
  filters:
    - lua_filter@trans_filter
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/

translator:
  dictionary: luna_pinyin
  prism: translate
  enable_user_dict: true
  enable_sentence: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default
